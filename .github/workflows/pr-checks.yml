name: 'PR Checks'

on:
  pull_request:

env:
  ASTRO_TELEMETRY_DISABLED: 1

jobs:
  check:
    name: Format Check + Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # no need to git lfs here
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run build

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test
