repos:
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: node_modules/.bin/prettier --write
        language: system
        files: \.(astro|ts|tsx|mjs|scss|css|json|md|ya?ml)$
      - id: astro-check
        name: astro check
        entry: node_modules/.bin/astro check
        language: system
        files: \.(astro|ts|tsx)$
        pass_filenames: false
